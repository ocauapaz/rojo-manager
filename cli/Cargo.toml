[package]
name = "rojo-manager-cli"
version = "0.2.0"
description = "Terminal dashboard for running and supervising multiple local Rojo serve processes"
license = "MIT"
edition = "2021"

[[bin]]
name = "rojom"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
